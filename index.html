<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;

    /* Fix the upside-down exported video */
    transform: rotate(180deg);
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
    <source src="ok.webm" type="video/webm">
</video>

</body>
</html>
